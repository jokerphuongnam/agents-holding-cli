name: Client CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-policy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify macOS Seatbelt policy isolation
        run: node tests/internal_policy_macos_test.mjs

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify public payload
        run: test -x full/client/scripts/holding && test -f full/install.sh && test -f full/SETUP.md
      - name: Run client tests
        run: |
          bash tests/client_feature_test.sh
          node full/client/scripts/oauth_test.mjs
          node tests/dispatch_errors_test.mjs
          node tests/listener_events_test.mjs
          node tests/workflow_invariant_test.mjs
          node tests/access_exception_test.mjs
          node tests/internal_policy_access_test.mjs
      - name: Verify Linux bubblewrap policy isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          node tests/internal_policy_linux_test.mjs
