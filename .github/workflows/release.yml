name: Release client distribution

on:
  push:
    tags:
      - '20[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-policy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify macOS Seatbelt policy isolation
        run: node tests/internal_policy_macos_test.mjs
  package:
    needs: macos-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public payload
        run: test -x full/client/scripts/holding && test -f full/install.sh && test -f full/SETUP.md
      - name: Run client tests
        run: |
          # Interactive TTY/menu tests are covered on macOS; CI packaging must
          # run deterministic, non-interactive contract tests on Linux.
          bash tests/client_feature_test.sh
          node full/client/scripts/oauth_test.mjs
          node tests/workflow_invariant_test.mjs
          node tests/access_exception_test.mjs
          node tests/internal_policy_access_test.mjs
      - name: Verify Linux bubblewrap policy isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          node tests/internal_policy_linux_test.mjs
      - name: Package public distribution
        run: |
          mkdir -p dist
          # Keep the output directory out of the input tree. Otherwise tar
          # reads the archive while it is still writing it and exits with
          # "file changed as we read it", preventing the release from being
          # created (and leaving the updater with a tag but no asset).
          tar --exclude=.git --exclude=./dist --exclude=./dist/** \
            -czf "dist/agents-holding-cli-${GITHUB_REF_NAME}.tar.gz" .
          git archive --format=zip --output="dist/agents-holding-cli-${GITHUB_REF_NAME}.zip" HEAD
      - name: Publish release and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
